name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt

      - name: Compile Python modules
        run: python -m py_compile app.py house.py

      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest ./test_app_50_cases.py -v \
            --junitxml=test-results/junit.xml \
            --html=test-results/unit-test-report.html \
            --self-contained-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/

      - name: Start Flask application
        run: |
          python app.py > flask.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(20):
              try:
                  with urlopen('http://127.0.0.1:5000/', timeout=2) as response:
                      if response.status == 200:
                          print('Flask application started successfully')
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Flask application did not start')
          PY
