name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.8
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt

      - name: Compile Python modules
        run: python -m py_compile app.py house.py

      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest test_cases.py -v -k "not FAIL" \
            --junitxml=test-results/junit.xml \
            --html=test-results/unit-test-report.html \
            --self-contained-html \
            --cov=app --cov-report=xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: test-results/

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=test_cases.py,static/**,model.pkl,house_data.csv
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=false

      - name: Start Flask application
        run: |
          python app.py > flask.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(20):
              try:
                  with urlopen('http://127.0.0.1:5000/', timeout=2) as response:
                      if response.status == 200:
                          print('Flask application started successfully')
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Flask application did not start')
          PY

  docker:
    name: Build and smoke test Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build --tag house-prediction:${{ github.sha }} .

      - name: Start Docker container
        run: docker run --detach --name house-prediction-ci --publish 5000:5000 house-prediction:${{ github.sha }}

      - name: Smoke test container
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(20):
              try:
                  with urlopen('http://127.0.0.1:5000/', timeout=2) as response:
                      if response.status == 200:
                          print('Docker container responded successfully')
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Docker container did not respond')
          PY

      - name: Show container logs
        if: failure()
        run: docker logs house-prediction-ci

      - name: Remove Docker container
        if: always()
        run: docker rm --force house-prediction-ci